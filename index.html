<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ الأسئلة الامتحانية الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Dynamic font and spacing variables for auto-fit sizing */
            --paper-font-size: 15px;
            --paper-line-height: 1.5;
            --paper-padding: 12mm;
            --question-gap: 12px;
            --subquestion-gap: 6px;
            --header-font-size: 14px;
            --title-font-size: 18px;
            --table-padding: 6px;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        .font-amiri {
            font-family: 'Amiri', serif;
        }

        /* Preview container custom scrollbar */
        .preview-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .preview-scroll::-webkit-scrollbar-track {
            background: #1e293b;
        }
        .preview-scroll::-webkit-scrollbar-shadow {
            background: #334155;
            border-radius: 4px;
        }

        /* A4 Paper Styling in Preview Mode */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            background: white;
            color: black;
            margin: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden; /* Prevents overflow visually */
            padding: var(--paper-padding);
            font-size: var(--paper-font-size);
            line-height: var(--paper-line-height);
            transition: all 0.2s ease-in-out;
        }

        /* Inner Traditional Frame */
        .paper-border {
            border: 2px solid #000;
            outline: 1px solid #000;
            outline-offset: 3px;
            height: 100%;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Compact Modes managed by JS Auto-Fit Engine */
        .a4-paper.compact-level-1 {
            --paper-font-size: 13.5px;
            --paper-line-height: 1.4;
            --paper-padding: 10mm;
            --question-gap: 8px;
            --subquestion-gap: 4px;
            --header-font-size: 12.5px;
            --title-font-size: 16px;
            --table-padding: 4px;
        }

        .a4-paper.compact-level-2 {
            --paper-font-size: 12px;
            --paper-line-height: 1.3;
            --paper-padding: 8mm;
            --question-gap: 6px;
            --subquestion-gap: 3px;
            --header-font-size: 11.5px;
            --title-font-size: 15px;
            --table-padding: 3px;
        }

        .a4-paper.compact-level-3 {
            --paper-font-size: 10.5px;
            --paper-line-height: 1.2;
            --paper-padding: 6mm;
            --question-gap: 4px;
            --subquestion-gap: 2px;
            --header-font-size: 10.5px;
            --title-font-size: 13.5px;
            --table-padding: 2px;
        }

        /* Paper Typography & Dynamic Elements */
        .paper-header-text {
            font-size: var(--header-font-size);
        }
        .paper-title-text {
            font-size: var(--title-font-size);
            font-weight: bold;
        }
        .question-item {
            margin-bottom: var(--question-gap);
        }
        .subquestion-item {
            margin-top: var(--subquestion-gap);
            margin-bottom: var(--subquestion-gap);
        }

        /* PRINT STYLES ENGINE */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0 !important;
            }
            
            html, body {
                width: 210mm;
                height: 297mm;
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .no-print {
                display: none !important;
            }

            .print-wrapper {
                padding: 0 !important;
                margin: 0 !important;
                width: 210mm !important;
                height: 297mm !important;
                overflow: hidden !important;
            }

            .a4-paper {
                box-shadow: none !important;
                width: 210mm !important;
                height: 297mm !important;
                max-height: 297mm !important;
                page-break-inside: avoid !important;
                page-break-after: avoid !important;
                break-after: avoid !important;
                border: none !important;
            }
        }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100">

    <header class="no-print h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg">
                <i class="fa-solid fa-file-pen text-sm"></i>
            </div>
            <div>
                <h1 class="font-bold text-base text-slate-100">منشئ الأسئلة الامتحانية الاحترافي</h1>
                <p class="text-xs text-slate-400">نظام التوزيع التلقائي والضبط القياسي لورقة A4 واحدة</p>
            </div>
        </div>

        <!-- Auto-Fit Status Badge & Action Controls -->
        <div class="flex items-center gap-4">
            <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="status-text">حالة الورقة: A4 صفحة واحدة متناسقة</span>
            </div>

            <button onclick="triggerPrint()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-sm flex items-center gap-2 transition-all shadow-md hover:shadow-indigo-500/20">
                <i class="fa-solid fa-print"></i>
                <span>طباعة / تصدير PDF</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT/RIGHT SIDEBAR INPUT FORM (380px) -->
        <aside class="no-print w-[420px] bg-slate-900 border-l border-slate-800 flex flex-col shrink-0 z-10">
            
            <!-- Navigation Tabs -->
            <div class="flex border-b border-slate-800 bg-slate-950/50">
                <button onclick="switchTab('header')" id="tab-btn-header" class="flex-1 py-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-heading"></i>
                    الترويسة والتصميم
                </button>
                <button onclick="switchTab('questions')" id="tab-btn-questions" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-list-check"></i>
                    الأسئلة والأقسام
                </button>
                <button onclick="switchTab('footer')" id="tab-btn-footer" class="flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-signature"></i>
                    الملاحظات والتوقيع
                </button>
            </div>

            <!-- Tab Content Body (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-4 space-y-4 preview-scroll">

                <!-- TAB 1: HEADER & SCHOOL INFO -->
                <div id="tab-header" class="space-y-4">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">بيانات الترويسة العلوية</h3>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الجمهورية / الوزارة</label>
                            <input type="text" id="input-ministry" value="جمهورية العراق - وزارة التربية" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">المديرية العامة</label>
                            <input type="text" id="input-directorate" value="المديرية العامة لتربية النجف الأشرف" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">اسم المدرسة</label>
                            <input type="text" id="input-school" value="متوسطة عقيل بن أبي طالب للبنين" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">المادة الدراسية</label>
                            <input type="text" id="input-subject" value="اللغة العربية" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الصف / المرحلة</label>
                            <input type="text" id="input-grade" value="الثاني المتوسط" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">عنوان الامتحان</label>
                            <input type="text" id="input-exam-title" value="امتحانات نهاية السنة" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الدور / الفصل</label>
                            <input type="text" id="input-round" value="الدور الأول" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">العام الدراسي</label>
                            <input type="text" id="input-year" value="2025 - 2026" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">الوقت المخصص</label>
                            <input type="text" id="input-time" value="ساعتان" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- TAB 2: QUESTIONS BUILDER -->
                <div id="tab-questions" class="space-y-4 hidden">
                    <div class="flex items-center justify-between">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">أسئلة الامتحان</h3>
                        <button onclick="addQuestion()" class="px-3 py-1 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-md text-xs font-semibold flex items-center gap-1 transition-all">
                            <i class="fa-solid fa-plus text-xs"></i> إضافة سؤال
                        </button>
                    </div>

                    <div id="questions-form-list" class="space-y-4">
                        <!-- Dynamic Question Forms insert here -->
                    </div>
                </div>

                <!-- TAB 3: NOTES & SIGNATURES -->
                <div id="tab-footer" class="space-y-4 hidden">
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">الملاحظات العامة والفرع التذييلي</h3>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">ملاحظة أعلى الورقة (تنبيه الطلاب)</label>
                        <input type="text" id="input-general-note" value="ملاحظة: الإجابة عن جميع الأسئلة (لكل سؤال 20 درجة)" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 mb-1">العبارة الختامية</label>
                        <input type="text" id="input-wish-note" value="مع أمنياتنا لكم بالنجاح والتوفيق" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">مدرس / مدرسو المادة</label>
                            <input type="text" id="input-teacher" value="مدرس المادة" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">مدير المدرسة</label>
                            <input type="text" id="input-headmaster" value="إدارة المدرسة" oninput="updatePaper()" class="w-full bg-slate-800 border border-slate-700 rounded-md px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- MAIN LIVE PREVIEW CANVAS AREA -->
        <main class="flex-1 bg-slate-950 p-6 overflow-y-auto preview-scroll flex justify-center items-start print-wrapper">
            
            <div id="exam-paper" class="a4-paper font-amiri">
                <div class="paper-border">
                    
                    <!-- TOP HEADER SECTION -->
                    <header class="border-b-2 border-black pb-2 mb-2">
                        <div class="grid grid-cols-3 text-center items-center">
                            <!-- Right Column: Ministry & School -->
                            <div class="text-right paper-header-text leading-tight space-y-0.5">
                                <p id="paper-ministry" class="font-bold"></p>
                                <p id="paper-directorate"></p>
                                <p id="paper-school" class="font-bold"></p>
                            </div>

                            <!-- Center Column: Exam Main Title -->
                            <div class="space-y-0.5">
                                <h2 id="paper-exam-title" class="paper-title-text"></h2>
                                <p id="paper-round" class="font-bold text-xs"></p>
                                <p id="paper-year" class="text-xs"></p>
                            </div>

                            <!-- Left Column: Subject, Grade, Time -->
                            <div class="text-left paper-header-text leading-tight space-y-0.5">
                                <p>المادة: <span id="paper-subject" class="font-bold"></span></p>
                                <p>الصف: <span id="paper-grade"></span></p>
                                <p>الوقت: <span id="paper-time"></span></p>
                            </div>
                        </div>

                        <!-- General Exam Note Line -->
                        <div id="paper-general-note-container" class="mt-2 text-center border-t border-dashed border-black pt-1">
                            <p id="paper-general-note" class="font-bold text-xs"></p>
                        </div>
                    </header>

                    <!-- QUESTIONS CONTENT AREA -->
                    <main id="paper-questions-list" class="flex-1 space-y-3">
                        <!-- Questions will be rendered dynamically here -->
                    </main>

                    <!-- FOOTER & SIGNATURES SECTION -->
                    <footer class="mt-2 pt-2 border-t border-black">
                        <p id="paper-wish-note" class="text-center font-bold text-sm mb-3"></p>
                        
                        <div class="flex justify-between items-end px-8 text-xs font-bold">
                            <div class="text-center">
                                <p class="mb-6">مدرس المادة</p>
                                <p id="paper-teacher" class="text-slate-800"></p>
                            </div>
                            <div class="text-center">
                                <p class="mb-6">مدير المدرسة</p>
                                <p id="paper-headmaster" class="text-slate-800"></p>
                            </div>
                        </div>
                    </footer>

                </div>
            </div>

        </main>
    </div>

    <script>
        // Initial Default State for Exam Questions
        let examData = {
            questions: [
                {
                    id: 1,
                    title: "س 1: اشرح عن البنكرياس بالتفصيل مع الرسم واذكر أهم وظائفه.",
                    score: "20 درجة",
                    subQuestions: []
                },
                {
                    id: 2,
                    title: "س 2: أجب عن الأسئلة التالية:",
                    score: "20 درجة",
                    subQuestions: [
                        { label: "أ", text: "عرف ما يلي لثلاث فقط: ( الأنسجة, الأنزيمات, الشرايين, البلعوم )." },
                        { label: "ب", text: "اختر الإجابة الصحيحة من بين القوسين لما يلي:" },
                        { label: "1", text: "الماء في الحالة الطبيعية يعتبر مركب (سائل ، صلب ، غاز)." },
                        { label: "2", text: "يكون الهواء بشكل أساسي من غاز (الأوكسجين ، النيتروجين)." }
                    ]
                },
                {
                    id: 3,
                    title: "س 3: علل أربعاً مما يأتي بكتابة السبب العلمي المباشر:",
                    score: "20 درجة",
                    subQuestions: [
                        { label: "1", text: "تسمى العضلات الهيكلية بالعضلات الإرادية." },
                        { label: "2", text: "وجود الوسائد الغضروفية بين الفقرات العظمية." },
                        { label: "3", text: "ضرورة ممارسة الرياضة البدنية بشكل منتظم." },
                        { label: "4", text: "تفرز الغدد العرقية العرق عند ارتفاع حرارة الجسم." }
                    ]
                }
            ]
        };

        // Tab Switching Logic
        function switchTab(tabName) {
            ['header', 'questions', 'footer'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-btn-${t}`).classList.remove('border-indigo-500', 'text-indigo-400');
                document.getElementById(`tab-btn-${t}`).classList.add('border-transparent', 'text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tabName}`).classList.add('border-indigo-500', 'text-indigo-400');
            document.getElementById(`tab-btn-${tabName}`).classList.remove('border-transparent', 'text-slate-400');
        }

        // Render Questions Control Forms in Sidebar
        function renderQuestionsForm() {
            const container = document.getElementById('questions-form-list');
            container.innerHTML = '';

            examData.questions.forEach((q, qIndex) => {
                const qEl = document.createElement('div');
                qEl.className = 'bg-slate-800/60 border border-slate-700/80 rounded-lg p-3 space-y-2';
                
                let subQuestionsHtml = '';
                q.subQuestions.forEach((sub, subIndex) => {
                    subQuestionsHtml += `
                        <div class="flex items-center gap-1.5 mt-1.5">
                            <input type="text" value="${sub.label}" onchange="updateSubQuestionLabel(${qIndex}, ${subIndex}, this.value)" class="w-10 bg-slate-900 border border-slate-700 rounded px-1.5 py-1 text-xs text-center text-indigo-300">
                            <input type="text" value="${sub.text}" onchange="updateSubQuestionText(${qIndex}, ${subIndex}, this.value)" class="flex-1 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
                            <button onclick="removeSubQuestion(${qIndex}, ${subIndex})" class="text-rose-400 hover:text-rose-300 px-1"><i class="fa-solid fa-times text-xs"></i></button>
                        </div>
                    `;
                });

                qEl.innerHTML = `
                    <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-bold text-indigo-400">سؤال ${qIndex + 1}</span>
                        <button onclick="removeQuestion(${qIndex})" class="text-xs text-rose-400 hover:text-rose-300">
                            <i class="fa-solid fa-trash-can"></i> حذف
                        </button>
                    </div>
                    <div>
                        <input type="text" value="${q.title}" oninput="updateQuestionTitle(${qIndex}, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100 font-medium">
                    </div>
                    <div class="flex items-center justify-between gap-2 pt-1">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] text-slate-400">الدرجة:</span>
                            <input type="text" value="${q.score}" oninput="updateQuestionScore(${qIndex}, this.value)" class="w-20 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200">
                        </div>
                        <button onclick="addSubQuestion(${qIndex})" class="text-[11px] bg-slate-700 hover:bg-slate-600 text-slate-200 px-2 py-1 rounded">
                            + فرع / نقطة
                        </button>
                    </div>
                    <div class="pr-2 border-r-2 border-indigo-500/30">
                        ${subQuestionsHtml}
                    </div>
                `;
                container.appendChild(qEl);
            });
        }

        // Add/Remove Question Handlers
        function addQuestion() {
            const newId = examData.questions.length + 1;
            examData.questions.push({
                id: newId,
                title: `س ${newId}: اكتب نص السؤال الجديد هنا...`,
                score: "20 درجة",
                subQuestions: []
            });
            renderQuestionsForm();
            updatePaper();
        }

        function removeQuestion(index) {
            examData.questions.splice(index, 1);
            renderQuestionsForm();
            updatePaper();
        }

        function addSubQuestion(qIndex) {
            examData.questions[qIndex].subQuestions.push({
                label: "أ",
                text: "فرع جديد أو نقطة فرعية جديدة..."
            });
            renderQuestionsForm();
            updatePaper();
        }

        function removeSubQuestion(qIndex, subIndex) {
            examData.questions[qIndex].subQuestions.splice(subIndex, 1);
            renderQuestionsForm();
            updatePaper();
        }

        function updateQuestionTitle(index, val) {
            examData.questions[index].title = val;
            updatePaper();
        }

        function updateQuestionScore(index, val) {
            examData.questions[index].score = val;
            updatePaper();
        }

        function updateSubQuestionLabel(qIndex, subIndex, val) {
            examData.questions[qIndex].subQuestions[subIndex].label = val;
            updatePaper();
        }

        function updateSubQuestionText(qIndex, subIndex, val) {
            examData.questions[qIndex].subQuestions[subIndex].text = val;
            updatePaper();
        }

        // Synchronize Form Input Values to A4 Paper DOM
        function updatePaper() {
            // Header
            document.getElementById('paper-ministry').innerText = document.getElementById('input-ministry').value;
            document.getElementById('paper-directorate').innerText = document.getElementById('input-directorate').value;
            document.getElementById('paper-school').innerText = document.getElementById('input-school').value;
            document.getElementById('paper-subject').innerText = document.getElementById('input-subject').value;
            document.getElementById('paper-grade').innerText = document.getElementById('input-grade').value;
            document.getElementById('paper-exam-title').innerText = document.getElementById('input-exam-title').value;
            document.getElementById('paper-round').innerText = document.getElementById('input-round').value;
            document.getElementById('paper-year').innerText = document.getElementById('input-year').value;
            document.getElementById('paper-time').innerText = document.getElementById('input-time').value;

            // Notes & Signatures
            const noteVal = document.getElementById('input-general-note').value;
            const noteContainer = document.getElementById('paper-general-note-container');
            if (noteVal.trim()) {
                noteContainer.style.display = 'block';
                document.getElementById('paper-general-note').innerText = noteVal;
            } else {
                noteContainer.style.display = 'none';
            }

            document.getElementById('paper-wish-note').innerText = document.getElementById('input-wish-note').value;
            document.getElementById('paper-teacher').innerText = document.getElementById('input-teacher').value;
            document.getElementById('paper-headmaster').innerText = document.getElementById('input-headmaster').value;

            // Render Questions List on Paper
            const listEl = document.getElementById('paper-questions-list');
            listEl.innerHTML = '';

            examData.questions.forEach((q) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question-item';

                let subHtml = '';
                if (q.subQuestions && q.subQuestions.length > 0) {
                    subHtml = `<div class="pr-4 space-y-1 mt-1">`;
                    q.subQuestions.forEach(sub => {
                        subHtml += `
                            <div class="subquestion-item flex items-start gap-2">
                                <span class="font-bold">${sub.label})</span>
                                <span class="flex-1">${sub.text}</span>
                            </div>
                        `;
                    });
                    subHtml += `</div>`;
                }

                qDiv.innerHTML = `
                    <div class="flex justify-between items-baseline font-bold border-b border-gray-200 pb-0.5">
                        <span class="text-black">${q.title}</span>
                        <span class="text-xs whitespace-nowrap mr-2">(${q.score})</span>
                    </div>
                    ${subHtml}
                `;
                listEl.appendChild(qDiv);
            });

            // Trigger Layout Auto-Fit Check
            autoFitLayout();
        }

        function autoFitLayout() {
            const paper = document.getElementById('exam-paper');
            const badge = document.getElementById('status-badge');
            const statusText = document.getElementById('status-text');

            // Reset compact classes first
            paper.classList.remove('compact-level-1', 'compact-level-2', 'compact-level-3');

            // Maximum allowed scroll height for printable inner area (~1120px on screen scale)
            const maxAllowedHeight = paper.clientHeight;

            if (paper.scrollHeight > maxAllowedHeight) {
                // Apply Level 1 Compact
                paper.classList.add('compact-level-1');
            }

            if (paper.scrollHeight > maxAllowedHeight) {
                // Apply Level 2 Compact
                paper.classList.remove('compact-level-1');
                paper.classList.add('compact-level-2');
            }

            if (paper.scrollHeight > maxAllowedHeight) {
                // Apply Level 3 Compact
                paper.classList.remove('compact-level-2');
                paper.classList.add('compact-level-3');
            }

            // Check if still overflowing even after Level 3
            if (paper.scrollHeight > maxAllowedHeight) {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20 flex items-center gap-2";
                statusText.innerText = "تحذير: الأسئلة كثيرة جداً وقد تتجاوز الصفحة الواحدة";
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center gap-2";
                statusText.innerText = "حالة الورقة: A4 صفحة واحدة متناسقة";
            }
        }

        // Trigger standard browser print window
        function triggerPrint() {
            window.print();
        }

        // Initialize Application
        window.onload = function() {
            renderQuestionsForm();
            updatePaper();
        };
    </script>
</body>
</html>
